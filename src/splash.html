<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SleepCoding</title>
<style>
:root{color-scheme:dark;--bg:#090b11;--panel:#10131a;--fg:#f3f6fb;--muted:#7f899d;--muted2:#5e6778;--a:#4aa9ff;--b:#9b7cff;--line:rgba(255,255,255,.08)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{font-family:"Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg)}
.canvas{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden;background:radial-gradient(50% 75% at 50% 42%,rgba(66,109,170,.09),transparent 68%),linear-gradient(180deg,#080a0f,#0a0c11)}
.ambient{position:absolute;inset:-25%;background:conic-gradient(from 200deg at 50% 50%,transparent 0 18%,rgba(65,150,255,.035),transparent 38%,rgba(151,120,255,.035),transparent 60%);filter:blur(34px);animation:slowspin 24s linear infinite;pointer-events:none}
.window{position:relative;width:min(640px,92vw);height:min(392px,88vh);min-width:470px;min-height:310px;display:flex;flex-direction:column;justify-content:center;padding:38px 44px 34px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(19,22,29,.985),rgba(12,15,21,.985));box-shadow:0 28px 100px rgba(0,0,0,.56),0 0 0 1px rgba(255,255,255,.02) inset;overflow:hidden}
.window:before{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(255,255,255,.026),transparent 30%,transparent 68%,rgba(137,117,255,.025));pointer-events:none}
.topline{position:absolute;left:24px;right:24px;top:16px;display:flex;justify-content:space-between;color:var(--muted2);font-size:10px;letter-spacing:.14em;text-transform:uppercase}.brand-mark{color:#aeb7c8}.edition{opacity:.75}
.center{display:grid;justify-items:center;gap:0;position:relative;z-index:1}.logo{width:66px;height:66px;object-fit:contain;margin-bottom:18px;filter:drop-shadow(0 10px 22px rgba(72,164,255,.18))}
.wordmark{font-size:32px;font-weight:600;letter-spacing:-.045em;line-height:1}.wordmark .sleep{color:#e7ebf5}.wordmark .coding{background:linear-gradient(95deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{margin-top:11px;color:var(--muted);font-size:12px;letter-spacing:.02em}.status-row{width:min(410px,100%);display:flex;align-items:center;gap:10px;margin-top:34px;font-size:11px;color:#b9c2d1}.spinner{width:12px;height:12px;border:1.5px solid rgba(255,255,255,.13);border-top-color:var(--a);border-right-color:var(--b);border-radius:50%;animation:spin .82s linear infinite;flex:0 0 auto}.status{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.progress{width:min(410px,100%);display:flex;align-items:center;gap:12px;margin-top:11px}.track{flex:1;height:3px;border-radius:999px;background:rgba(255,255,255,.085);overflow:hidden}.bar{height:100%;width:0%;border-radius:999px;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 12px rgba(74,169,255,.28);transition:width .28s ease}.pct{width:36px;text-align:right;color:var(--muted2);font-size:10px;font-variant-numeric:tabular-nums}
.bottom{position:absolute;left:24px;right:24px;bottom:16px;display:flex;justify-content:space-between;color:var(--muted2);font-size:9.5px;letter-spacing:.03em}.hint{opacity:.65}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes slowspin{to{transform:rotate(360deg)}}
@media(max-width:600px){.window{min-width:0;width:92vw;height:82vh;padding:30px 24px 28px}.wordmark{font-size:27px}.logo{width:58px;height:58px}.topline{left:18px;right:18px}.bottom{left:18px;right:18px}.status-row,.progress{width:100%}}
@media(max-height:420px){.window{height:92vh;padding-top:24px}.logo{width:48px;height:48px;margin-bottom:12px}.tag{margin-top:7px}.status-row{margin-top:20px}}
@media(prefers-reduced-motion:reduce){.ambient,.spinner{animation:none}.bar{transition:none}}
</style>
</head>
<body>
<div class="canvas"><div class="ambient"></div>
  <section class="window" aria-label="SleepCoding startup">
    <div class="topline"><span class="brand-mark">SLEEPCODING</span><span class="edition">IDE</span></div>
    <div class="center">
      <img class="logo" src="../build/icon.png" alt="SleepCoding">
      <div class="wordmark"><span class="sleep">Sleep</span><span class="coding">Coding</span></div>
      <div class="tag">A calm workspace for serious coding.</div>
      <div class="status-row"><span class="spinner"></span><span id="status" class="status">Starting SleepCoding…</span></div>
      <div class="progress"><div class="track"><div id="bar" class="bar"></div></div><span id="pct" class="pct">0%</span></div>
    </div>
    <div class="bottom"><span id="ver">SleepCoding • 1.7.1</span><span class="hint">Loading workspace</span></div>
  </section>
</div>
<script>
(() => {
  const status=document.getElementById('status'),bar=document.getElementById('bar'),pct=document.getElementById('pct');
  const stages=['Starting SleepCoding…','Preparing workspace…','Loading editor engine…','Loading workspace services…','Connecting tools…','Finalizing workbench…','Ready'];
  let target=7,current=5,index=0;
  function setBootProgress(value,text){ target=Math.max(target,Math.min(100,Number(value)||0)); if(text) status.textContent=text; }
  window.setBootProgress=setBootProgress;
  const timer=setInterval(()=>{ if(current<target) current += Math.max(.25,(target-current)*.18); else if(target<92) { index=(index+1)%stages.length; if(index<stages.length-1) status.textContent=stages[index]; } bar.style.width=current.toFixed(1)+'%'; pct.textContent=Math.round(current)+'%'; },80);
  setBootProgress(8,stages[0]);
  addEventListener('beforeunload',()=>clearInterval(timer));
})();
</script>
</body>
</html>
